[package]
name = "cube"
version = "0.1.2"
authors = ["Brock Aegean <brock@bits.app>"]
edition = "2021"

[dependencies]
axum = "0.8.9"
async-trait = "0.1.92"
bech32 = "0.12.0"
bit-vec = "0.10.2"
bitcoin = "0.32.102"
bitcoincore-rpc = "0.19.0"
blake2 = "0.10.6"
bls_on_arkworks = "0.3.0"
chrono = "0.4.45"
colored = "3.1.1"
easy-upnp = "0.3.2"
futures = "0.3.34"
hex = "0.4.3"
libc = "0.2.191"
nostr-sdk = "0.45.6"
rand = "0.10.4"
reqwest = "0.13.5"
secp = { version = "0.7.0", default-features = false, features = ["k256", "serde"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
sled = "0.34.7"
tokio = { version = "1.54.1", features = ["full"] }
uint = { version = "0.10.2", default-features = false }
zeroize = "1.9.2"
bincode = { version = "2", features = ["serde"] }

[lib]
name = "cube"
path = "src/lib.rs"

[[bin]]
name = "cube"
path = "src/operative/main.rs"

[lints.clippy]
module_inception = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
wrong_self_convention = "allow"
large_enum_variant = "allow"
manual_div_ceil = "allow"
assign_op_pattern = "allow"
manual_async_fn = "allow"
